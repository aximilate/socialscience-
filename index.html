<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Text Presenter</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
    }

    #setup {
        padding: 20px;
    }

    textarea {
        width: 100%;
        height: 200px;
        font-size: 16px;
    }

    input, button {
        margin-top: 10px;
        padding: 10px;
        font-size: 16px;
    }

    #presentation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        display: none;
        justify-content: center;
        align-items: flex-start; /* <-- ВАЖНО: вверх */
        text-align: center;
    }

    #text {
        color: white;
        word-wrap: break-word;
        padding: 40px 20px 20px 20px; /* отступ сверху */
    }
</style>
</head>
<body>

<div id="setup">
    <h2>Введите текст (каждая строка — отдельный слайд)</h2>
    <textarea id="inputText"></textarea><br>

    <label>Размер шрифта:</label><br>
    <input type="number" id="fontSize" value="80"><br>

    <button onclick="start()">Начать</button>
    <button onclick="goFullscreen()">Полноэкранный режим</button>
</div>

<div id="presentation">
    <div id="text"></div>
</div>

<script>
let slides = [];
let index = 0;
let visible = false;

function start() {
    const text = document.getElementById("inputText").value;
    slides = text.split("\n").filter(line => line.trim() !== "");
    index = 0;

    document.getElementById("setup").style.display = "none";
    document.getElementById("presentation").style.display = "flex";

    updateText();
    hideText();
}

function updateText() {
    const fontSize = document.getElementById("fontSize").value;
    const textEl = document.getElementById("text");
    textEl.style.fontSize = fontSize + "px";
    textEl.textContent = slides[index] || "";
}

function showText() {
    document.getElementById("text").style.display = "block";
    visible = true;
}

function hideText() {
    document.getElementById("text").style.display = "none";
    visible = false;
}

document.addEventListener("keydown", function(e) {
    if (document.getElementById("presentation").style.display !== "flex") return;

    if (e.code === "Space") {
        e.preventDefault();
        if (visible) {
            hideText();
        } else {
            showText();
        }
    }

    if (visible) {
        if (e.code === "ArrowRight" || e.code === "ArrowDown") {
            index = Math.min(index + 1, slides.length - 1);
            updateText();
        }

        if (e.code === "ArrowLeft" || e.code === "ArrowUp") {
            index = Math.max(index - 1, 0);
            updateText();
        }
    }
});

function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) {
        el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
    }
}
</script>

</body>
</html>
